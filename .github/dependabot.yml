version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Must not be newer than "engines.vscode" in package.json, or `vsce package` refuses to build.
      # Raise both together by hand when the minimum supported VS Code version goes up.
      - dependency-name: '@types/vscode'
      # typescript-eslint only supports TypeScript below 6.1, so a TypeScript 7 bump makes
      # `npm ci` fail with ERESOLVE. Revisit once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
