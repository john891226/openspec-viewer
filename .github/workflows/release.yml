name: Release

# Push a tag like v0.1.0 to publish. The tag must equal the version in package.json and must point
# at a commit that is already on main. Everything runs in order, and a failure stops the rest:
#
#   1. ci      the same checks as every pull request
#   2. release verify the tag, build the .vsix, create the GitHub Release, publish to the registries
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never run two releases at once, and never cancel one half-way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, to check the tag is on main

      - name: Check the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge the pull request first, then tag the merge commit."
            exit 1
          fi

      - name: Check the tag matches the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # The prepackage hook fails on placeholders or missing metadata.
      - name: Package
        run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --generate-notes

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath ./*.vsix --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish ./*.vsix --pat "$OVSX_PAT"

      - name: Note skipped registries
        if: env.VSCE_PAT == '' || env.OVSX_PAT == ''
        run: echo "::warning::A registry token secret (VSCE_PAT / OVSX_PAT) is not configured, so that publish step was skipped. See docs/PUBLISHING.md."
